# Configuracion de renta-fija. Este fichero es opcional.

# Carpeta donde se guardan la cache de series del BCE (series/*.csv), los
# parametros (renta-fija.cfg) y las exportaciones. Se crea si no existe.
# ~/ se expande al home.
data_root = data

# Pedir al BCE lo publicado desde la ultima vez al arrancar (si / no). Con
# "no" el programa trabaja con lo que haya en cache; el boton "Actualizar
# datos" sigue funcionando.
update_on_start = si

# Fondo real con el que se hace el backtest y para el que se da la senal de
# entrada: su ISIN. Los valores liquidativos diarios se bajan de Finect y se
# guardan en series/fondo_<ISIN>.csv. Por omision, iShares Euro Investment
# Grade Corporate Bond Index Fund (IE) Institutional Acc EUR. Con "no" se
# trabaja solo con el bono AAA sintetico.
fondo = IE00B67T5G21
